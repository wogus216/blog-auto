[project]
name = "blog-auto"
version = "0.1.0"
description = "AI-driven blog automation for Tistory and Naver"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "playwright>=1.48.0",
    "pydantic>=2.9.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "markdown>=3.7",
    "rich>=13.9.0",
    "typer>=0.12.5",
    "google-auth-oauthlib>=1.3.1",
    "google-api-python-client>=2.194.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
]

[project.scripts]
blog-auto = "blog_auto.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blog_auto"]

[tool.ruff]
line-length = 100
target-version = "py311"
